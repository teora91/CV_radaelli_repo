name: Build LaTeX CV

on:
  push:
    branches: [ main ]   # run every time you push to main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv_main.tex      # 👈 your main file name here
          latexmk_use_xelatex: true   # good for Unicode and modern fonts

      - name: Move PDF to outputs/
        run: |
          mkdir -p outputs
          mv *.pdf outputs/

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v3
        with:
          name: cv-pdf
          path: outputs/
