name: Build LaTeX CV

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # also updated to latest version

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-llt.tex
          latexmk_use_xelatex: true

      - name: Move PDF to outputs/
        run: |
          mkdir -p outputs
          mv *.pdf outputs/

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4   # ✅ updated from v3 to v4
        with:
          name: cv-pdf
          path: outputs/
